<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payroll - Future Designz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="sidebar">
        <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo">
        <a href="index.html">🏠 Dashboard</a>
        <a href="employees.html">👥 Employees</a>
        <a href="attendance.html">⌚ Live Attendance</a>
        <a href="payroll.html" class="active">💰 Payroll Slips</a>
    </div>
    <div class="main-content">
        <h1 class="brand-title">Future Designz Salary Cloud</h1>
        <div class="card">
            <h3>Generate Salary Report</h3>
            <input type="month" id="salaryMonth" class="btn">
            <input type="number" id="perDayRate" placeholder="Rate Per Day (Rs.)" value="1500">
            <button class="btn btn-primary" onclick="calculateSalaries()">Process Payroll</button>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Designation</th><th>Days</th><th>Total Salary</th><th>Status</th></tr>
                </thead>
                <tbody id="payrollBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function calculateSalaries() {
            const month = document.getElementById('salaryMonth').value;
            const rate = document.getElementById('perDayRate').value;
            if(!month) return alert("Please select a month!");

            const emps = (await db.ref('employees').once('value')).val();
            const logs = (await db.ref('attendance_logs').once('value')).val();
            let html = "";

            if(!emps) return alert("No employees found!");

            Object.keys(emps).forEach(id => {
                let days = 0;
                if(logs) {
                    Object.keys(logs).forEach(date => {
                        if(date.startsWith(month) && logs[date][id]) days++;
                    });
                }
                const total = days * rate;
                html += `<tr>
                    <td>${id}</td>
                    <td>${emps[id].name}</td>
                    <td>${emps[id].role || 'Staff'}</td>
                    <td>${days}</td>
                    <td style="font-weight:bold; color:#1a237e;">Rs. ${total}</td>
                    <td><span class="status-present">Calculated</span></td>
                </tr>`;
            });
            document.getElementById('payrollBody').innerHTML = html;
        }
    </script>
</body>
</html>
