<!DOCTYPE html>
<html lang="en">
<head>
    <title>HR Dashboard - Future Designz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="sidebar">
        <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo">
        <a href="index.html" class="active">🏠 Dashboard</a>
        <a href="employees.html">👥 Employees</a>
        <a href="attendance.html">⌚ Live Attendance</a>
        <a href="payroll.html">💰 Payroll Slips</a>
    </div>
    <div class="main-content">
        <div class="header-flex">
            <h1 class="brand-title">Future Designz HR Cloud</h1>
            <div id="liveTime" style="font-weight: 600; color: #666;"></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card" style="background: #3949ab;"><h3>Total Staff</h3><h2 id="totalEmp">0</h2></div>
            <div class="stat-card" style="background: #2e7d32;"><h3>Present Today</h3><h2 id="todayPres">0</h2></div>
            <div class="stat-card" style="background: #e64a19;"><h3>On Leave</h3><h2>0</h2></div>
        </div>
        <div class="card">
            <h3>Recent Activity</h3>
            <table id="recentLogs">
                <thead><tr><th>Time</th><th>Employee</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Clock
        setInterval(() => { document.getElementById('liveTime').innerText = new Date().toLocaleString(); }, 1000);

        // Stats Logic
        db.ref('employees').on('value', s => document.getElementById('totalEmp').innerText = s.numChildren());
        const today = new Date().toISOString().split('T')[0];
        db.ref('attendance_logs/' + today).on('value', s => {
            document.getElementById('todayPres').innerText = s.numChildren();
            let html = "";
            s.forEach(log => {
                html += `<tr><td>${log.val().checkIn}</td><td>${log.val().name}</td><td><span class="status-present">Check-In</span></td></tr>`;
            });
            document.querySelector('#recentLogs tbody').innerHTML = html;
        });
    </script>
</body>
</html>
