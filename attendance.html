<!DOCTYPE html>
<html lang="en">
<head>
    <title>Attendance Logs - Future Designz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="loginModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <input id="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <input id="password" type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <p id="loginError" class="text-danger"></p>
                </div>
                <div class="modal-footer">
                    <button onclick="login()" class="btn btn-primary">Login</button>
                    <button onclick="signUp()" class="btn btn-secondary">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex">
        <!-- Desktop Sidebar -->
        <div class="d-none d-md-block bg-primary text-white p-3" style="width: 260px; min-height: 100vh; position: fixed; z-index: 100;">
            <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo mb-4" style="width: 100%; max-width: 190px; filter: brightness(0) invert(1);">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button id="darkModeToggle" class="btn btn-outline-light btn-sm"><i class="bi bi-moon me-1"></i>Dark Mode</button>
            </div>
            <a href="index.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a href="employees.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-people me-2"></i>Employees</a>
            <a href="attendance.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded active" style="background: var(--secondary);"><i class="bi bi-clock me-2"></i>Live Attendance</a>
            <a href="payroll.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-cash me-2"></i>Payroll Slips</a>
            <a href="leave.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-calendar-event me-2"></i>Leave Management</a>
            <a onclick="logout()" class="d-block text-white text-decoration-none p-2 mb-2 rounded" style="cursor: pointer;">Logout</a>
        </div>
        <!-- Mobile Offcanvas Sidebar -->
        <div class="offcanvas offcanvas-start bg-primary text-white" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel" style="width: 260px;">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Menu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body p-3">
                <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo mb-4" style="width: 100%; max-width: 190px; filter: brightness(0) invert(1);">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button id="darkModeToggleMobile" class="btn btn-outline-light btn-sm"><i class="bi bi-moon me-1"></i>Dark Mode</button>
                </div>
                <a href="index.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                <a href="employees.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-people me-2"></i>Employees</a>
                <a href="attendance.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded active" style="background: var(--secondary);"><i class="bi bi-clock me-2"></i>Live Attendance</a>
                <a href="payroll.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-cash me-2"></i>Payroll Slips</a>
                <a href="leave.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded"><i class="bi bi-calendar-event me-2"></i>Leave Management</a>
                <a onclick="logout()" class="d-block text-white text-decoration-none p-2 mb-2 rounded" style="cursor: pointer;">Logout</a>
            </div>
        </div>
        <div class="main-content flex-fill p-4">
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 d-md-none">
                <div class="container-fluid">
                    <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
                        ☰ Menu
                    </button>
                    <span class="navbar-brand mb-0 h1">Biometric Cloud Logs</span>
                </div>
            </nav>
            <div class="header-flex d-flex justify-content-between align-items-center mb-4 d-none d-md-flex">
                <h1 class="brand-title mb-0">Biometric Cloud Logs</h1>
                <button onclick="changePassword()" class="btn btn-outline-primary">Change Password</button>
            </div>
            <div class="card p-4">
                <input type="month" id="monthFilter" onchange="loadLogs()" class="form-control mb-3">
                <table class="table table-striped">
                    <thead><tr><th>Date</th><th>Emp ID</th><th>Name</th><th>Sign In</th><th>Sign Out</th><th>Status</th></tr></thead>
                    <tbody id="attendanceTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = null;
        let currentRole = null;

        // Initialize users if not exist
        if (!localStorage.getItem('users')) {
            const users = {
                'Hamza': { password: CryptoJS.SHA256('Hamza0327@@').toString(), role: 'primary' },
                'awais': { password: CryptoJS.SHA256('awais786').toString(), role: 'primary' }
            };
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Check if logged in
        const loggedUser = localStorage.getItem('currentUser');
        if (loggedUser) {
            currentUser = loggedUser;
            currentRole = localStorage.getItem('currentRole');
            document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);
            loadLogs();
        } else {
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.show();
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) {
                document.getElementById('loginError').textContent = 'Please fill in all fields';
                return;
            }
            const hash = CryptoJS.SHA256(pass).toString();
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user] && users[user].password === hash) {
                currentUser = user;
                currentRole = users[user].role;
                localStorage.setItem('currentUser', user);
                localStorage.setItem('currentRole', currentRole);
                const modal = new bootstrap.Modal(document.getElementById('loginModal'));
                modal.hide();
                document.querySelector('.sidebar').style.display = 'block';
                document.querySelector('.main-content').style.display = 'block';
                document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);
                loadLogs();
                document.getElementById('loginError').textContent = '';
            } else {
                document.getElementById('loginError').textContent = 'Invalid credentials';
            }
        }

        function signUp() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) {
                document.getElementById('loginError').textContent = 'Please fill in all fields';
                return;
            }
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user]) {
                document.getElementById('loginError').textContent = 'User already exists';
                return;
            }
            const hash = CryptoJS.SHA256(pass).toString();
            users[user] = { password: hash, role: 'manager' };
            localStorage.setItem('users', JSON.stringify(users));
            currentUser = user;
            currentRole = 'manager';
            localStorage.setItem('currentUser', user);
            localStorage.setItem('currentRole', 'manager');
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.hide();
            document.querySelector('.sidebar').style.display = 'block';
            document.querySelector('.main-content').style.display = 'block';
            document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);
            loadLogs();
            document.getElementById('loginError').textContent = '';
        }

        function changePassword() {
            const newPass = prompt('Enter new password');
            if (newPass) {
                const hash = CryptoJS.SHA256(newPass).toString();
                const users = JSON.parse(localStorage.getItem('users') || '{}');
                users[currentUser].password = hash;
                localStorage.setItem('users', JSON.stringify(users));
                alert('Password updated successfully');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            currentUser = null;
            currentRole = null;
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.show();
            document.querySelector('.sidebar').style.display = 'none';
            document.querySelector('.main-content').style.display = 'none';
        }

        function loadLogs() {
            const selectedMonth = document.getElementById('monthFilter').value;
            db.ref('attendance_logs').on('value', snapshot => {
                const data = snapshot.val();
                let html = "";
                if(!data) return;

                Object.keys(data).sort().reverse().forEach(date => {
                    if(selectedMonth && !date.startsWith(selectedMonth)) return;
                    Object.keys(data[date]).forEach(empId => {
                        const log = data[date][empId];
                        html += `<tr>
                            <td>${date}</td>
                            <td>${empId}</td>
                            <td>${log.name}</td>
                            <td style="color:green; font-weight:bold;">${log.checkIn}</td>
                            <td style="color:red; font-weight:bold;">${log.checkOut}</td>
                            <td><span class="status-present">Present</span></td>
                        </tr>`;
                    });
                });
                document.getElementById('attendanceTable').innerHTML = html;
            });
        }

        // Dark Mode Toggle
        function toggleDarkMode(button) {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            if (currentTheme === 'dark') {
                html.removeAttribute('data-bs-theme');
                button.innerHTML = '<i class="bi bi-moon me-1"></i>Dark Mode';
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                button.innerHTML = '<i class="bi bi-sun me-1"></i>Light Mode';
            }
            localStorage.setItem('theme', html.getAttribute('data-bs-theme') || 'light');
            // Sync both buttons
            document.getElementById('darkModeToggle').innerHTML = button.innerHTML;
            document.getElementById('darkModeToggleMobile').innerHTML = button.innerHTML;
        }

        document.getElementById('darkModeToggle').addEventListener('click', function() {
            toggleDarkMode(this);
        });

        document.getElementById('darkModeToggleMobile').addEventListener('click', function() {
            toggleDarkMode(this);
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
            document.getElementById('darkModeToggle').innerHTML = '<i class="bi bi-sun me-1"></i>Light Mode';
            document.getElementById('darkModeToggleMobile').innerHTML = '<i class="bi bi-sun me-1"></i>Light Mode';
        } else {
            document.getElementById('darkModeToggle').innerHTML = '<i class="bi bi-moon me-1"></i>Dark Mode';
            document.getElementById('darkModeToggleMobile').innerHTML = '<i class="bi bi-moon me-1"></i>Dark Mode';
        }

        // Notification Function
        function showNotification(message, type = 'info') {
            const toastEl = document.getElementById('notificationToast');
            const toastBody = document.getElementById('toastMessage');
            toastBody.textContent = message;
            toastEl.className = `toast bg-${type}`;
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="notificationToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                Hello, world! This is a toast message.
            </div>
        </div>
    </div>
</body>
</html>
