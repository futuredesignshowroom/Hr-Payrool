<!DOCTYPE html>
<html lang="en">
<head>
    <title>Live Attendance - Future Designz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="sidebar">
        <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo" alt="Future Designz">
        <a href="index.html">Dashboard</a>
        <a href="employees.html">Employees</a>
        <a href="payroll.html">Payroll</a>
        <a href="attendance.html" class="active">Live Attendance</a>
    </div>

    <div class="main-content">
        <div class="brand-name">Wireless Biometric Cloud (Firebase)</div>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Live Connection Status</h3>
            <p id="cloudStatus" style="color: orange;">Connecting to Cloud...</p>
            <input type="month" id="monthFilter" onchange="loadFromFirebase()" style="margin-top: 10px; padding: 5px;">
        </div>

        <div class="table-container">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Emp ID</th>
                        <th>Name</th>
                        <th>Sign In</th>
                        <th>Sign Out</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="liveLogs">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        // Bhai, Firebase Console se apni details yahan dalain:
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "your-app-id"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- LOAD DATA REAL-TIME ---
        function loadFromFirebase() {
            const selectedMonth = document.getElementById('monthFilter').value;
            const logRef = db.ref('attendance_logs');

            // Listening for real-time updates
            logRef.on('value', (snapshot) => {
                document.getElementById('cloudStatus').innerText = "✅ Cloud Synced (Live)";
                document.getElementById('cloudStatus').style.color = "green";

                const data = snapshot.val();
                let html = "";

                if (data) {
                    // Dates ko reverse order mein dikhane ke liye
                    const dates = Object.keys(data).sort().reverse();

                    dates.forEach(date => {
                        // Month filter check
                        if (selectedMonth && !date.startsWith(selectedMonth)) return;

                        const entries = data[date];
                        for (let empId in entries) {
                            const entry = entries[empId];
                            html += `<tr>
                                <td>${date}</td>
                                <td>${empId}</td>
                                <td>${entry.name}</td>
                                <td style="color:green">${entry.checkIn}</td>
                                <td style="color:red">${entry.checkOut}</td>
                                <td><b>Present</b></td>
                            </tr>`;
                        }
                    });
                }
                document.getElementById('liveLogs').innerHTML = html || "<tr><td colspan='6'>No records found.</td></tr>";
            });
        }

        window.onload = function() {
            // Default current month
            const now = new Date();
            document.getElementById('monthFilter').value = now.getFullYear() + "-" + (now.getMonth()+1).toString().padStart(2, '0');
            loadFromFirebase();
        };
    </script>
</body>
</html>
