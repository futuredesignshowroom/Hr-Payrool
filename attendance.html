<!DOCTYPE html>
<html lang="en">
<head>
    <title>Attendance Logs - Future Designz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div id="loginModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div style="background:white; padding:20px; border-radius:5px; width:300px;">
            <h2>Login</h2>
            <input id="username" placeholder="Username" required><br><br>
            <input id="password" type="password" placeholder="Password" required><br><br>
            <button onclick="login()">Login</button>
            <button onclick="signUp()">Sign Up</button>
            <p id="loginError" style="color:red;"></p>
        </div>
    </div>
    <div class="sidebar" style="display:none;">
        <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo">
        <a href="index.html">🏠 Dashboard</a>
        <a href="employees.html">👥 Employees</a>
        <a href="attendance.html" class="active">⌚ Live Attendance</a>
        <a href="payroll.html">💰 Payroll Slips</a>
        <a onclick="logout()">Logout</a>
    </div>
    <div class="main-content" style="display:none;">
        <div class="header-flex">
            <h1 class="brand-title">Biometric Cloud Logs</h1>
            <button onclick="changePassword()">Change Password</button>
            <input type="month" id="monthFilter" onchange="loadLogs()" class="btn">
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Date</th><th>Emp ID</th><th>Name</th><th>Sign In</th><th>Sign Out</th><th>Status</th></tr></thead>
                <tbody id="attendanceTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = null;
        let currentRole = null;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                const roleSnap = await db.ref('users/' + user.uid + '/role').once('value');
                currentRole = roleSnap.val() || 'user';
                document.getElementById('loginModal').style.display = 'none';
                document.querySelector('.sidebar').style.display = 'block';
                document.querySelector('.main-content').style.display = 'block';
                document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);
                loadLogs();
            } else {
                document.getElementById('loginModal').style.display = 'flex';
                document.querySelector('.sidebar').style.display = 'none';
                document.querySelector('.main-content').style.display = 'none';
            }
        });

        async function login() {
            const userInput = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const email = userInput + '@hrpayroll.local';
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                document.getElementById('loginError').textContent = '';
            } catch (error) {
                document.getElementById('loginError').textContent = error.message;
            }
        }

        async function signUp() {
            const userInput = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const email = userInput + '@hrpayroll.local';
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                await db.ref('users/' + userCredential.user.uid).set({ role: 'manager' });
                document.getElementById('loginError').textContent = '';
            } catch (error) {
                document.getElementById('loginError').textContent = error.message;
            }
        }

        function changePassword() {
            const newPass = prompt('Enter new password');
            if (newPass && auth.currentUser) {
                auth.currentUser.updatePassword(newPass).then(() => {
                    alert('Password updated successfully');
                }).catch(error => {
                    alert('Error: ' + error.message);
                });
            }
        }

        function logout() {
            auth.signOut();
        }

        function loadLogs() {
            const selectedMonth = document.getElementById('monthFilter').value;
            db.ref('attendance_logs').on('value', snapshot => {
                const data = snapshot.val();
                let html = "";
                if(!data) return;

                Object.keys(data).sort().reverse().forEach(date => {
                    if(selectedMonth && !date.startsWith(selectedMonth)) return;
                    Object.keys(data[date]).forEach(empId => {
                        const log = data[date][empId];
                        html += `<tr>
                            <td>${date}</td>
                            <td>${empId}</td>
                            <td>${log.name}</td>
                            <td style="color:green; font-weight:bold;">${log.checkIn}</td>
                            <td style="color:red; font-weight:bold;">${log.checkOut}</td>
                            <td><span class="status-present">Present</span></td>
                        </tr>`;
                    });
                });
                document.getElementById('attendanceTable').innerHTML = html;
            });
        }
    </script>
</body>
</html>
