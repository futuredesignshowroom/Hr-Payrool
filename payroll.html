<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payroll - Future Designz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="loginModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div style="background:white; padding:20px; border-radius:5px; width:300px;">
            <h2>Login</h2>
            <input id="username" placeholder="Username" required><br><br>
            <input id="password" type="password" placeholder="Password" required><br><br>
            <button onclick="login()">Login</button>
            <button onclick="signUp()">Sign Up</button>
            <p id="loginError" style="color:red;"></p>
        </div>
    </div>
    <div class="sidebar" style="display:none;">
        <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo">
        <a href="index.html">🏠 Dashboard</a>
        <a href="employees.html">👥 Employees</a>
        <a href="attendance.html">⌚ Live Attendance</a>
        <a href="payroll.html" class="active">💰 Payroll Slips</a>
        <a onclick="logout()">Logout</a>
    </div>
    <div class="main-content" style="display:none;">
        <h1 class="brand-title">Salary & Payroll Management</h1>
        <button onclick="changePassword()">Change Password</button>
        <div class="card">
            <input type="month" id="salaryMonth" class="btn">
            <button class="btn btn-primary" onclick="calculateSalaries()">Generate Monthly Report</button>
        </div>
        <div class="card">
            <table id="payrollTable">
                <thead><tr><th>Emp ID</th><th>Name</th><th>Days Present</th><th>Estimated Salary</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = null;
        let currentRole = null;

        // Initialize users if not exist
        if (!localStorage.getItem('users')) {
            const users = {
                'Hamza': { password: CryptoJS.SHA256('Hamza0327@@').toString(), role: 'primary' },
                'awais': { password: CryptoJS.SHA256('awais786').toString(), role: 'primary' }
            };
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Check if logged in
        const loggedUser = localStorage.getItem('currentUser');
        if (loggedUser) {
            currentUser = loggedUser;
            currentRole = localStorage.getItem('currentRole');
            document.getElementById('loginModal').style.display = 'none';
            document.querySelector('.sidebar').style.display = 'block';
            document.querySelector('.main-content').style.display = 'block';
        } else {
            document.getElementById('loginModal').style.display = 'flex';
            document.querySelector('.sidebar').style.display = 'none';
            document.querySelector('.main-content').style.display = 'none';
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const hash = CryptoJS.SHA256(pass).toString();
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user] && users[user].password === hash) {
                currentUser = user;
                currentRole = users[user].role;
                localStorage.setItem('currentUser', user);
                localStorage.setItem('currentRole', currentRole);
                document.getElementById('loginModal').style.display = 'none';
                document.querySelector('.sidebar').style.display = 'block';
                document.querySelector('.main-content').style.display = 'block';
                document.getElementById('loginError').textContent = '';
            } else {
                document.getElementById('loginError').textContent = 'Invalid credentials';
            }
        }

        function signUp() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user]) {
                document.getElementById('loginError').textContent = 'User already exists';
                return;
            }
            const hash = CryptoJS.SHA256(pass).toString();
            users[user] = { password: hash, role: 'manager' };
            localStorage.setItem('users', JSON.stringify(users));
            currentUser = user;
            currentRole = 'manager';
            localStorage.setItem('currentUser', user);
            localStorage.setItem('currentRole', 'manager');
            document.getElementById('loginModal').style.display = 'none';
            document.querySelector('.sidebar').style.display = 'block';
            document.querySelector('.main-content').style.display = 'block';
            document.getElementById('loginError').textContent = '';
        }

        function changePassword() {
            const newPass = prompt('Enter new password');
            if (newPass) {
                const hash = CryptoJS.SHA256(newPass).toString();
                const users = JSON.parse(localStorage.getItem('users') || '{}');
                users[currentUser].password = hash;
                localStorage.setItem('users', JSON.stringify(users));
                alert('Password updated successfully');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            currentUser = null;
            currentRole = null;
            document.getElementById('loginModal').style.display = 'flex';
            document.querySelector('.sidebar').style.display = 'none';
            document.querySelector('.main-content').style.display = 'none';
        }

        async function calculateSalaries() {
            const selectedMonth = document.getElementById('salaryMonth').value;
            if(!selectedMonth) return alert("Please select a month");

            const empsSnapshot = await db.ref('employees').once('value');
            const logsSnapshot = await db.ref('attendance_logs').once('value');
            const logs = logsSnapshot.val();
            let html = "";

            empsSnapshot.forEach(emp => {
                let presentDays = 0;
                const empId = emp.key;
                const empName = emp.val().name;

                if(logs) {
                    Object.keys(logs).forEach(date => {
                        if(date.startsWith(selectedMonth) && logs[date][empId]) {
                            presentDays++;
                        }
                    });
                }
                
                // Example: 1500 per day salary logic
                const salary = presentDays * 1500; 

                html += `<tr><td>${empId}</td><td>${empName}</td><td>${presentDays}</td><td>Rs. ${salary}</td></tr>`;
            });
            document.querySelector('#payrollTable tbody').innerHTML = html;
        }
    </script>
</body>
</html>
