<!DOCTYPE html>
<html lang="en">
<head>
    <title>Leave Management - Future Designz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="loginModal" class="modal fade show" style="display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.5);" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <input id="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <input id="password" type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <p id="loginError" class="text-danger"></p>
                </div>
                <div class="modal-footer">
                    <button onclick="login()" class="btn btn-primary">Login</button>
                    <button onclick="signUp()" class="btn btn-secondary">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex">
        <div class="sidebar bg-primary text-white p-3" style="width: 260px; min-height: 100vh; position: fixed; z-index: 100; display: none;">
            <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo mb-4" style="width: 100%; max-width: 190px; filter: brightness(0) invert(1);">
            <a href="index.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded">🏠 Dashboard</a>
            <a href="employees.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded">👥 Employees</a>
            <a href="attendance.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded">⌚ Live Attendance</a>
            <a href="payroll.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded">💰 Payroll Slips</a>
            <a href="leave.html" class="d-block text-white text-decoration-none p-2 mb-2 rounded active" style="background: var(--secondary);">📅 Leave Management</a>
            <a onclick="logout()" class="d-block text-white text-decoration-none p-2 mb-2 rounded" style="cursor: pointer;">Logout</a>
        </div>
        <div class="main-content flex-fill p-4" style="margin-left: 260px; display: none;">
            <h1 class="brand-title mb-4">Leave Management</h1>
            <button onclick="changePassword()" class="btn btn-outline-primary mb-3">Change Password</button>
            <div class="card p-4 mb-4">
                <h3>Request Leave</h3>
                <div class="row g-3">
                    <div class="col-md-6">
                        <select id="empSelect" class="form-control">
                            <option value="">Select Employee</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <select id="leaveType" class="form-control">
                            <option value="annual">Annual Leave</option>
                            <option value="sick">Sick Leave</option>
                            <option value="casual">Casual Leave</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input type="date" id="startDate" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <input type="date" id="endDate" class="form-control">
                    </div>
                    <div class="col-12">
                        <textarea id="reason" class="form-control" placeholder="Reason"></textarea>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" onclick="requestLeave()">Submit Request</button>
            </div>
            <div class="card p-4">
                <h3>Leave Requests</h3>
                <table class="table table-striped">
                    <thead>
                        <tr><th>Employee</th><th>Type</th><th>Start Date</th><th>End Date</th><th>Reason</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody id="leaveTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = null;
        let currentRole = null;

        // Initialize users if not exist
        if (!localStorage.getItem('users')) {
            const users = {
                'Hamza': { password: CryptoJS.SHA256('Hamza0327@@').toString(), role: 'primary' },
                'awais': { password: CryptoJS.SHA256('awais786').toString(), role: 'primary' }
            };
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Check if logged in
        const loggedUser = localStorage.getItem('currentUser');
        if (loggedUser) {
            currentUser = loggedUser;
            currentRole = localStorage.getItem('currentRole');
            loadEmployees();
            loadLeaves();
        } else {
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.show();
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) {
                document.getElementById('loginError').textContent = 'Please fill in all fields';
                return;
            }
            const hash = CryptoJS.SHA256(pass).toString();
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user] && users[user].password === hash) {
                currentUser = user;
                currentRole = users[user].role;
                localStorage.setItem('currentUser', user);
                localStorage.setItem('currentRole', currentRole);
                const modal = new bootstrap.Modal(document.getElementById('loginModal'));
                modal.hide();
                document.querySelector('.sidebar').style.display = 'block';
                document.querySelector('.main-content').style.display = 'block';
                loadEmployees();
                loadLeaves();
                document.getElementById('loginError').textContent = '';
            } else {
                document.getElementById('loginError').textContent = 'Invalid credentials';
            }
        }

        function signUp() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) {
                document.getElementById('loginError').textContent = 'Please fill in all fields';
                return;
            }
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[user]) {
                document.getElementById('loginError').textContent = 'User already exists';
                return;
            }
            const hash = CryptoJS.SHA256(pass).toString();
            users[user] = { password: hash, role: 'manager' };
            localStorage.setItem('users', JSON.stringify(users));
            currentUser = user;
            currentRole = 'manager';
            localStorage.setItem('currentUser', user);
            localStorage.setItem('currentRole', 'manager');
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.hide();
            document.querySelector('.sidebar').style.display = 'block';
            document.querySelector('.main-content').style.display = 'block';
            loadEmployees();
            loadLeaves();
            document.getElementById('loginError').textContent = '';
        }

        function changePassword() {
            const newPass = prompt('Enter new password');
            if (newPass) {
                const hash = CryptoJS.SHA256(newPass).toString();
                const users = JSON.parse(localStorage.getItem('users') || '{}');
                users[currentUser].password = hash;
                localStorage.setItem('users', JSON.stringify(users));
                alert('Password updated successfully');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            currentUser = null;
            currentRole = null;
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.show();
            document.querySelector('.sidebar').style.display = 'none';
            document.querySelector('.main-content').style.display = 'none';
        }

        function loadEmployees() {
            db.ref('employees').once('value', s => {
                let options = '<option value="">Select Employee</option>';
                s.forEach(emp => {
                    options += `<option value="${emp.key}">${emp.val().name}</option>`;
                });
                document.getElementById('empSelect').innerHTML = options;
            });
        }

        function requestLeave() {
            const empId = document.getElementById('empSelect').value;
            const type = document.getElementById('leaveType').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const reason = document.getElementById('reason').value;
            if (!empId || !start || !end) return alert('Please fill all fields');
            db.ref('leaves').push({
                empId: empId,
                type: type,
                startDate: start,
                endDate: end,
                reason: reason,
                status: 'pending'
            });
            alert('Leave request submitted');
            document.getElementById('empSelect').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('reason').value = '';
        }

        function loadLeaves() {
            db.ref('leaves').on('value', s => {
                let html = '';
                s.forEach(leave => {
                    const data = leave.val();
                    html += `<tr>
                        <td>${data.empId}</td>
                        <td>${data.type}</td>
                        <td>${data.startDate}</td>
                        <td>${data.endDate}</td>
                        <td>${data.reason}</td>
                        <td><span class="badge bg-warning">${data.status}</span></td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="approveLeave('${leave.key}')">Approve</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectLeave('${leave.key}')">Reject</button>
                        </td>
                    </tr>`;
                });
                document.getElementById('leaveTable').innerHTML = html;
            });
        }

        function approveLeave(key) {
            db.ref('leaves/' + key).update({ status: 'approved' });
        }

        function rejectLeave(key) {
            db.ref('leaves/' + key).update({ status: 'rejected' });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
