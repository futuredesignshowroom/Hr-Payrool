<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Employees - Future Designz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="sidebar">
        <img src="https://futuredesignz.com/wp-content/uploads/2022/12/future-designs-logo1.webp" class="sidebar-logo">
        <a href="index.html">🏠 Dashboard</a>
        <a href="employees.html" class="active">👥 Employees</a>
        <a href="attendance.html">⌚ Live Attendance</a>
        <a href="payroll.html">💰 Payroll Slips</a>
    </div>
    <div class="main-content">
        <h1 class="brand-title">Employee Registry</h1>
        <div class="card">
            <h3>Register New Staff</h3>
            <input type="number" id="empId" placeholder="ZKTeco Device ID">
            <input type="text" id="empName" placeholder="Full Name">
            <input type="text" id="empRole" placeholder="Designation">
            <button class="btn btn-primary" onclick="addEmployee()">Register Employee</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Device ID</th><th>Name</th><th>Role</th><th>Action</th></tr></thead>
                <tbody id="empList"></tbody>
            </table>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://hr-payrool-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function addEmployee() {
            const id = document.getElementById('empId').value;
            const name = document.getElementById('empName').value;
            const role = document.getElementById('empRole').value;
            if(id && name) {
                db.ref('employees/' + id).set({ name: name, role: role });
                document.getElementById('empId').value = '';
                document.getElementById('empName').value = '';
            }
        }

        db.ref('employees').on('value', s => {
            let html = "";
            s.forEach(emp => {
                html += `<tr><td><b>${emp.key}</b></td><td>${emp.val().name}</td><td>${emp.val().role || 'Staff'}</td>
                <td><button class="btn btn-danger" onclick="db.ref('employees/${emp.key}').remove()">Remove</button></td></tr>`;
            });
            document.getElementById('empList').innerHTML = html;
        });
    </script>
</body>
</html>
